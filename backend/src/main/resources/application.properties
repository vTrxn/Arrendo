# ==============================================================================
# ARCHIVO DE CONFIGURACION MAESTRO SPRING BOOT 3 (application.properties)
# ==============================================================================

# server.port: Puerto asignado dinámicamente por la nube (Render/Railway: ${PORT}) o 8080 por defecto
server.port=${PORT:8080}

# server.servlet.context-path=/api: Prefijo global de todas las rutas HTTP REST (ejemplo: /api/v1/properties)
server.servlet.context-path=/api

# spring.application.name: Nombre identificador del microservicio en el ecosistema Spring
spring.application.name=ArrendoBackendEclipse

# Base de datos: Conexión oficial a Supabase Cloud (PostgreSQL 17 en la nube)
spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres.xiejuueuxqheyiawxffz
spring.datasource.password=P\u00f15+1r\u00b4\u00f1\u00b43{

# spring.jpa.database-platform: Dialecto específico de Hibernate para generar SQL optimizado para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# spring.jpa.hibernate.ddl-auto=update: Hibernate crea o altera las tablas automáticamente preservando los datos existentes
spring.jpa.hibernate.ddl-auto=update

# spring.jpa.show-sql=false: Mantiene la consola limpia y optimizada
spring.jpa.show-sql=false

# Desactiva el reinicio automático de DevTools al modificar archivos
spring.devtools.restart.enabled=false

# jwt.secret: Clave criptográfica simétrica de 256 bits utilizada para firmar digitalmente los Tokens JWT (HMAC-SHA256)
jwt.secret=ArrendoUniempresarialSecretKeyJWT2026SecureKey1234567890

# jwt.expiration=86400000: Tiempo de vida útil de cada Token JWT en milisegundos (86,400,000 ms = 24 horas exactas)
jwt.expiration=86400000